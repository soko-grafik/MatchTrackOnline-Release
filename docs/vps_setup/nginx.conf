# MatchTrack Online - Nginx Configuration (VPS / HestiaCP)
# Ersetzen Sie "your-domain.de" durch Ihre tatsächliche Domain (z. B. matchtrack.de).

# ==============================================================================
# RTMP Streaming Block
# HINWEIS: Dieser Block MUSS in /etc/nginx/nginx.conf auf oberster Ebene stehen
# (außerhalb des "http { ... }" Blocks).
# Erfordert: sudo apt install libnginx-mod-rtmp
# ==============================================================================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # RTMP Application für DJI Osmo Action & OBS Studio
        application live {
            live on;
            record off;

            # HLS Konvertierung für Web-Player (LiveStreamModal)
            hls on;
            hls_path /var/www/matchtrack/live/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_nested on; # Erzeugt Unterordner <stream_key>/index.m3u8 (z. B. osmo4/index.m3u8)

            # Optional: Low-Latency Tuning
            # hls_fragment_naming system;
        }
    }
}

# ==============================================================================
# HTTP / HTTPS Web Server Block (sites-available/matchtrack)
# ==============================================================================
server {
    listen 80;
    server_name your-domain.de www.your-domain.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.de www.your-domain.de;

    # SSL-Zertifikate (z. B. von Let's Encrypt / HestiaCP)
    # ssl_certificate /etc/letsencrypt/live/your-domain.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.de/privkey.pem;

    client_max_body_size 2048M; # Ermöglicht den Upload großer Videodateien (bis 2 GB)

    # 1. HLS Livestream Auslieferung an MediaMTX (für LiveStreamModal & /live Player)
    # Matcht nur Playlists (.m3u8) und Video-Fragmente (.ts, .mp4, .m4s), sodass
    # die Next.js Web-Page https://matchtrack.de/live unbeeinträchtigt bleibt.
    location ~* ^/live/.+\.(m3u8|ts|mp4|m4s)$ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # 2. Statische Video- & HLS-Auslieferung direkt über Nginx (spart CPU/FastAPI Ressourcen)
    location /uploads/ {
        alias /var/www/matchtrack/backend/uploads/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            image/png png;
            image/jpeg jpg;
        }
    }

    # 3. FastAPI Backend API Proxy (Uvicorn läuft auf Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
    }

    # 4. Next.js Web Frontend Proxy (Node/PM2 läuft auf Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
