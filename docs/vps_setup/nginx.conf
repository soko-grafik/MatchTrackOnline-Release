# MatchTrack Online - Nginx Reverse Proxy Configuration (Contabo VPS / HestiaCP)
# Ersetzen Sie "your-domain.de" durch Ihre tatsächliche Domain.

server {
    listen 80;
    server_name your-domain.de www.your-domain.de;
    return 301 https://$host$request_uri;
}

server {
    listen 445 ssl http2; # Oder Port 443 mit SSL
    server_name your-domain.de www.your-domain.de;

    # SSL-Zertifikate (z.B. von Let's Encrypt / HestiaCP)
    # ssl_certificate /etc/letsencrypt/live/your-domain.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.de/privkey.pem;

    client_max_body_size 2048M; # Ermöglicht den Upload großer Videodateien (bis 2 GB)

    # 1. Statische Video- & HLS-Auslieferung direkt über Nginx (Spart CPU/FastAPI Ressourcen)
    location /uploads/ {
        alias /var/www/matchtrack/backend/uploads/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            image/png png;
            image/jpeg jpg;
        }
    }

    # 2. FastAPI Backend API Proxy (Uvicorn läuft auf Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
    }

    # 3. Next.js Web Frontend Proxy (Node/PM2 läuft auf Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
